<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>__TITLE__</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2300a884'/%3E%3Cpath d='M16 7a9 9 0 0 0-7.7 13.6L7 25l4.5-1.2A9 9 0 1 0 16 7z' fill='%23fff'/%3E%3C/svg%3E">
<style>
__CSS__
</style>
</head>
<body>

<svg class="sprite" aria-hidden="true">
  <!-- WhatsApp's default contact avatar: a plain silhouette on a flat field. -->
  <symbol id="i-person" viewBox="0 0 212 212">
    <path d="M106.3 51.1c14.8 0 26.8 12 26.8 26.8s-12 26.8-26.8 26.8-26.8-12-26.8-26.8 12-26.8 26.8-26.8zm0 117.5c-18.6 0-35.2-8.6-46.1-22 2.4-17.9 27.2-27.6 46.1-27.6s43.7 9.7 46.1 27.6c-10.9 13.4-27.5 22-46.1 22z"/>
  </symbol>
  <symbol id="i-group" viewBox="0 0 212 212">
    <path d="M79 64c11.6 0 21 9.4 21 21s-9.4 21-21 21-21-9.4-21-21 9.4-21 21-21zm58 10c9.4 0 17 7.6 17 17s-7.6 17-17 17-17-7.6-17-17 7.6-17 17-17zM79 116c15 0 35.5 7.5 37.5 22.2C108.3 148.4 94.5 155 79 155s-29.3-6.6-37.5-16.8C43.5 123.5 64 116 79 116zm58 6c11.9 0 27.7 5.9 29.2 17.4-5.9 7.2-13.6 12.8-22.4 16 2.6-3.9 4.2-8.3 4.2-12.9 0-7.9-3.4-14.6-8.8-19.9.6-.3 1.2-.5 1.8-.6z"/>
  </symbol>
  <symbol id="i-tick" viewBox="0 0 16 11"><path d="M1 6.2 3.7 9 10 1.8"/><path d="M5.6 6.2 8.3 9 14.6 1.8"/></symbol>
  <symbol id="i-tick1" viewBox="0 0 16 11"><path d="M3.4 6.2 6.1 9 12.4 1.8"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 20 20"><path d="M5 8l5 5 5-5"/></symbol>
</svg>

<div id="app" class="app" hidden>

  <nav class="rail" aria-label="Sections">
    <div class="rail__group">
      <button class="rail__btn is-on" id="railChats" title="Chats" aria-label="Chats">
        <svg viewBox="0 0 24 24"><path d="M12 3c5 0 9 3.6 9 8s-4 8-9 8c-1.2 0-2.3-.2-3.3-.5L4 20l1.3-3.5C3.9 15.1 3 13.2 3 11c0-4.4 4-8 9-8z"/></svg>
        <span class="rail__count" id="railChatCount"></span>
      </button>
      <button class="rail__btn" id="railMedia" title="All media in this archive" aria-label="Media">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="M4.5 17.5 9.5 12.5l3 3 3-2.5 4 4.5"/></svg>
      </button>
      <button class="rail__btn" id="railStats" title="Archive statistics" aria-label="Statistics">
        <svg viewBox="0 0 24 24"><path d="M5 20V10m7 10V4m7 16v-6"/></svg>
      </button>
    </div>
    <div class="rail__group rail__group--end">
      <button class="rail__btn" id="railTheme" title="Theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="rail__btn" id="railPrint" title="Print / save as PDF" aria-label="Print">
        <svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v7H8z"/></svg>
      </button>
      <button class="rail__btn rail__btn--me" id="railMe" title="Archive owner" aria-label="Archive owner"></button>
    </div>
  </nav>

  <aside class="pane pane--list" id="sidePane">
    <header class="bar bar--side">
      <h1 class="bar__h1">Chats</h1>
      <div class="bar__actions">
        <button class="iconbtn" id="btnMenu" title="Archive details" aria-label="Archive details">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.4" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
    </header>

    <div class="searchbar">
      <div class="searchbox">
        <svg class="searchbox__icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search messages">
        <button class="searchbox__clear" id="searchClear" hidden aria-label="Clear search">&times;</button>
      </div>
      <div class="filters" id="filters">
        <button class="pill is-on" data-filter="all">All</button>
        <button class="pill" data-filter="direct">Direct</button>
        <button class="pill" data-filter="group">Groups</button>
        <button class="pill" data-filter="media">Media</button>
      </div>
    </div>

    <div class="scroll" id="listScroll">
      <ul class="chatlist" id="chatList" role="listbox" aria-label="Conversations"></ul>
      <div class="results" id="results" hidden></div>
    </div>
  </aside>

  <main class="pane pane--chat" id="chatPane">
    <div class="empty" id="emptyState">
      <svg viewBox="0 0 303 172" class="empty__art" aria-hidden="true">
        <rect x="26" y="20" width="186" height="116" rx="14"/>
        <path d="M74 150l24-22M164 150l-22-20"/>
        <path d="M54 54h96M54 74h130M54 94h74"/>
        <circle cx="244" cy="96" r="34"/><path d="M244 80v18l12 8"/>
      </svg>
      <h1 id="emptyTitle">WhatsMerge</h1>
      <p id="emptyBody">Select a conversation to read it.</p>
      <div class="empty__foot">
        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <span id="emptyPrivacy">Opens from your disk. Nothing is sent anywhere.</span>
      </div>
    </div>

    <div class="thread" id="thread" hidden>
      <header class="bar bar--chat">
        <button class="iconbtn iconbtn--back" id="btnBack" aria-label="Back to conversations">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <span class="avatar" id="chatAvatar"></span>
        <div class="bar__title" id="chatTitleWrap" role="button" tabindex="0">
          <strong id="chatTitle"></strong>
          <span class="bar__sub" id="chatSub"></span>
        </div>
        <div class="bar__actions">
          <button class="iconbtn" id="btnFind" title="Search in this chat" aria-label="Search in this chat">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          </button>
          <button class="iconbtn" id="btnInfo" title="Conversation details" aria-label="Conversation details">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.4" fill="currentColor" stroke="none"/></svg>
          </button>
        </div>
      </header>

      <div class="scroll scroll--msgs" id="msgScroll">
        <button class="loadmore" id="loadMore" hidden>Load earlier messages</button>
        <div class="msgs" id="msgs"></div>
      </div>

      <button class="jumpdown" id="jumpDown" hidden title="Scroll to latest" aria-label="Scroll to latest">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
      </button>

      <footer class="composer" aria-hidden="true">
        <svg class="composer__icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5s1.2 1.8 3.5 1.8 3.5-1.8 3.5-1.8"/><circle cx="9" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="1" fill="currentColor" stroke="none"/></svg>
        <svg class="composer__icon" viewBox="0 0 24 24"><path d="M17 8.5V16a5 5 0 0 1-10 0V7a3.2 3.2 0 0 1 6.4 0v8.6a1.4 1.4 0 0 1-2.8 0V8.5"/></svg>
        <div class="composer__input">Read-only archive — rebuilt from exported files</div>
        <svg class="composer__icon" viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M6 11v1a6 6 0 0 0 12 0v-1M12 18v3"/></svg>
      </footer>
    </div>
  </main>

  <aside class="drawer" id="drawer" hidden>
    <header class="bar bar--drawer">
      <button class="iconbtn" id="drawerClose" aria-label="Close panel">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <strong id="drawerTitle">Details</strong>
    </header>
    <div class="scroll" id="drawerBody"></div>
  </aside>

</div>

<div class="lightbox" id="lightbox" hidden>
  <header class="lightbox__bar">
    <span class="lightbox__who" id="lbWho"></span>
    <button class="lightbox__close" id="lbClose" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <button class="lightbox__nav lightbox__nav--prev" id="lbPrev" aria-label="Previous">
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <div class="lightbox__stage" id="lbStage"></div>
  <button class="lightbox__nav lightbox__nav--next" id="lbNext" aria-label="Next">
    <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <div class="lightbox__caption" id="lbCaption"></div>
</div>

<div class="boot" id="boot">Rebuilding conversations&hellip;</div>

<script type="application/json" id="payload">__DATA__</script>
<script>
__JS__
</script>
</body>
</html>
