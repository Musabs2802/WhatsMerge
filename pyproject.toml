[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsmerge"
version = "0.1.0"
description = "Merge WhatsApp chat exports into one browsable, WhatsApp-styled HTML file"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["whatsapp", "export", "chat", "archive", "html"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Chat",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
whatsmerge = "app.cli:main"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["assets/*"]
